<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%232563eb' d='M6.5 19a4.5 4.5 0 0 1-.42-8.98A6 6 0 0 1 17.65 8.5 5 5 0 0 1 17.5 19z'/></svg>" />
    <meta name="theme-color" content="#f8fafc" />
    <title>EasyCloud</title>
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode).
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('ec.theme') || '{}')
          var dark = t.mode === 'dark' || (t.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          var r = document.documentElement
          r.dataset.theme = dark ? 'dark' : 'light'
          if (/^#[0-9a-f]{6}$/i.test(t.accent || '')) r.style.setProperty('--brand', t.accent)
          var l = localStorage.getItem('ec.locale')
          r.lang = l === 'en' || l === 'zh-CN' ? l : ((navigator.languages || [navigator.language]).some(function (x) { return /^zh/i.test(x) }) ? 'zh-CN' : 'en')
        } catch (e) {
          document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
