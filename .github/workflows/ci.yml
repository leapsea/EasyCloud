# Pushes to main and pull requests: full tests; on main also the image
# ghcr.io/<owner>/<repo>:latest / :sha-<short sha>.
# Releases: release.yml (app, tags v*) and plugins.yml (plugins/<id>/v*).
name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the running check; on main every run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: { contents: read }

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Does this push change the program? Plugin and documentation changes do not
  # rebuild the image (plugins are released by plugins.yml).
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: diff
        env: { BEFORE: "${{ github.event.before }}" }
        run: |
          # First push of the branch, force push or unknown base: build.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          if echo "$files" | grep -Evq '^(plugins/|docs/|\.github/workflows/plugins\.yml$)|\.md$'; then app=true; else app=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, changes]
    if: needs.changes.outputs.app == 'true'
    permissions: { contents: read, packages: write }
    uses: ./.github/workflows/image.yml
