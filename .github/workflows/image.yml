# Builds and pushes the multi-arch image ghcr.io/<owner>/<repo>, reused by
# ci.yml (main branch) and release.yml (tags v*). Tags:
#   main branch push  -> :latest :sha-<short sha>  (app version dev-<short sha>)
#   tag v1.2.3        -> :1.2.3 :1.2               (app version 1.2.3)
#   tag v1.2.3-rc.1   -> :1.2.3-rc.1
# :latest follows main only, so tagging an older commit never moves it back.
# The image name is lower-cased by metadata-action (GHCR requires it).
name: image
on:
  workflow_call:

permissions: { contents: read, packages: write }

jobs:
  image:
    runs-on: ubuntu-latest
    # One push per ref at a time, so an older commit cannot overwrite :latest last.
    concurrency: { group: "image-${{ github.ref }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
      # Plugin compatibility checks treat dev-* as a development build; a branch
      # name such as "main" is not semver and would make every engine check fail.
      - name: App version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=dev-${GITHUB_SHA::7}; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false # :latest comes only from the raw tag below
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          # web and Go stages cross-compile on the build platform; only the final
          # "apk add" runs under QEMU for arm64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source links the package to this repository
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Anonymous pull works
        run: |
          docker logout ghcr.io
          img="ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.meta.outputs.version }}"
          if ! docker pull -q "$img"; then
            echo "::error::$img cannot be pulled without login. The GHCR package is private:"
            echo "::error::GitHub > your profile/org > Packages > easycloud > Package settings > Change visibility > Public, then re-run this job."
            exit 1
          fi
          docker run --rm "$img" version
