# Main program release: binaries + install.sh on the GitHub Release (marked latest)
# and the multi-arch image ghcr.io/<owner>/<repo>:<version> / :<major>.<minor> / :latest.
# Triggered only by tags v*; plugin tags (plugins/<id>/v*) go to plugins.yml.
#   git tag v0.5.0 && git push origin v0.5.0
# A pre-release tag (v0.5.0-rc.1) publishes a pre-release and an image tag, but
# never moves "latest".
name: release
on:
  push:
    tags: ["v*"]

permissions: { contents: read }

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o easycloud ./cmd/easycloud
            tar -czf dist/easycloud-linux-$arch.tar.gz easycloud README.md deploy/easycloud.example.yaml
            rm easycloud
          done
          cp deploy/install.sh dist/install.sh
          (cd dist && sha256sum easycloud-linux-*.tar.gz install.sh > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # install.sh is fetched from releases/latest: only app releases may be "latest".
          make_latest: ${{ !contains(github.ref_name, '-') }}

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest only for final releases (semver without pre-release part)
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source links the package to this repository
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Anonymous pull works
        run: |
          docker logout ghcr.io
          img="ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.meta.outputs.version }}"
          if ! docker pull -q "$img"; then
            echo "::error::$img cannot be pulled without login. The GHCR package is private:"
            echo "::error::GitHub > your profile/org > Packages > easycloud > Package settings > Change visibility > Public, then re-run this job."
            exit 1
          fi
          docker run --rm "$img" version
