# Main program release: binaries + install.sh on the GitHub Release (marked latest)
# and the multi-arch image ghcr.io/<owner>/<repo>:<version> / :<major>.<minor>
# (:latest is built from main by ci.yml).
# Triggered only by tags v*; plugin tags (plugins/<id>/v*) go to plugins.yml.
#   git tag v0.5.0 && git push origin v0.5.0
# A pre-release tag (v0.5.0-rc.1) publishes a GitHub pre-release and only the
# image tag :0.5.0-rc.1.
name: release
on:
  push:
    tags: ["v*"]

permissions: { contents: read }

jobs:
  test:
    uses: ./.github/workflows/test.yml

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o easycloud ./cmd/easycloud
            tar -czf dist/easycloud-linux-$arch.tar.gz easycloud README.md deploy/easycloud.example.yaml
            rm easycloud
          done
          cp deploy/install.sh dist/install.sh
          (cd dist && sha256sum easycloud-linux-*.tar.gz install.sh > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # install.sh is fetched from releases/latest: only app releases may be "latest".
          make_latest: ${{ !contains(github.ref_name, '-') }}

  image:
    needs: test
    permissions: { contents: read, packages: write }
    uses: ./.github/workflows/image.yml
