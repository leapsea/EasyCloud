# EasyCloud with the built-in SQLite database (no db container).
#   mkdir -p data config logs && sudo chown 1000:2000 data config logs
#   docker compose -f compose.sqlite.yml up -d
services:
  app:
    container_name: EasyCloud
    image: ghcr.io/leapsea/easycloud:latest
    user: 1000:2000
    restart: unless-stopped
    ports:
      - 2030:80
    volumes:
      - "./data:/data"
      - "./config:/config"
      - "./logs:/logs" # optional
    env_file:
      - path: .env
        required: false

  # Jellyfin can read the same host directory directly; no network protocol needed.
  # jellyfin:
  #   image: jellyfin/jellyfin
  #   volumes:
  #     - ./data/share/media:/media:ro
